name: Generate Snake

on:
  schedule:
    # 每 12 小时自动运行一次
    - cron: "0 */12 * * *" 
  
  # 支持手动一键运行
  workflow_dispatch:
  
  # push 到 main 或 master 时自动触发
  push:
    branches:
      - master
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#2DDE98&color_dots=#0a1a3f,#0e3a6b,#1268b0,#0d94dd,#00AEFF
            dist/github-contribution-grid-snake-dark.svg?color_snake=#2DDE98&color_dots=#0a1a3f,#0e3a6b,#1268b0,#0d94dd,#00AEFF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
